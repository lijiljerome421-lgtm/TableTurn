<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TableTurn | Admin Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f7f3ed;

            color: #25211e;
        }

        .login-card {
            width: 100%;
            max-width: 420px;

            padding: 40px;

            background: #fffdf9;

            border: 1px solid #e4dbd0;

            border-radius: 18px;

            box-shadow:
                0 20px 60px
                rgba(45, 35, 25, 0.10);
        }

        .logo {
            text-align: center;

            font-size: 29px;

            font-weight: 800;

            margin-bottom: 8px;
        }

        .logo span {
            color: #b96d35;
        }

        .subtitle {
            text-align: center;

            color: #756d66;

            font-size: 14px;

            margin-bottom: 32px;
        }

        label {
            display: block;

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 8px;
        }

        input {
            width: 100%;

            height: 52px;

            padding: 0 15px;

            margin-bottom: 20px;

            border: 1px solid #d9cec1;

            border-radius: 9px;

            outline: none;

            font-size: 15px;
        }

        input:focus {
            border-color: #b96d35;

            box-shadow:
                0 0 0 3px
                rgba(185, 109, 53, 0.10);
        }

        button {
            width: 100%;

            height: 52px;

            border: none;

            border-radius: 9px;

            background: #25211e;

            color: white;

            font-weight: 800;

            cursor: pointer;
        }

        button:hover {
            background: #b96d35;
        }

        #error {
            display: none;

            margin-top: 15px;

            padding: 12px;

            border-radius: 8px;

            background: #f8e5e2;

            color: #a84b3e;

            font-size: 13px;

            text-align: center;
        }

        .back {
            display: block;

            margin-top: 22px;

            text-align: center;

            color: #756d66;

            text-decoration: none;

            font-size: 13px;
        }

        .back:hover {
            color: #b96d35;
        }

    </style>

</head>


<body>

<div class="login-card">

    <div class="logo">
        Table<span>Turn</span>
    </div>

    <p class="subtitle">
        Administrator Login
    </p>


    <form id="loginForm">

        <label>
            Username
        </label>

        <input
            type="text"
            id="username"
            placeholder="Enter username"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
        >


        <button type="submit">
            Login to Admin Panel
        </button>

    </form>


    <div id="error"></div>


    <a
        href="/"
        class="back"
    >
        ← Back to reservation
    </a>

</div>


<script>

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const username =
                document.getElementById(
                    "username"
                ).value;

            const password =
                document.getElementById(
                    "password"
                ).value;

            const error =
                document.getElementById(
                    "error"
                );

            error.style.display = "none";


            const formData =
                new URLSearchParams();

            formData.append(
                "username",
                username
            );

            formData.append(
                "password",
                password
            );


            try {

                const response =
                    await fetch(
                        "/api/admin/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/x-www-form-urlencoded"
                            },

                            body: formData
                        }
                    );


                if (response.ok) {

                    window.location.href =
                        "/admin.html";

                    return;

                }


                const data =
                    await response.json();

                error.textContent =
                    data.message ||
                    "Invalid username or password";

                error.style.display =
                    "block";

            }
            catch (error) {

                error.textContent =
                    "Unable to connect to server.";

                error.style.display =
                    "block";
            }

        }
    );

</script>

</body>

</html>
